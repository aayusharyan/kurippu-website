# Manual release: bump semver, verify and build the site, deploy the built
# output to Firebase Hosting, then tag and publish a GitHub Release.

name: Create Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - minor
          - major
        default: minor

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Tags are the release source of truth. Before the first release, use the
      # package version so a minor bump from 0.1.0 produces 0.2.0.
      - name: Calculate release version
        id: version
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | awk 'NR==1')
          package_version=$(node --print "require('./package.json').version")

          if [[ -n "$latest_tag" ]]; then
            current_version=${latest_tag#v}
            if [[ "$package_version" != "$current_version" ]]; then
              echo "package.json is at ${package_version}, but the latest tag is ${latest_tag}." >&2
              echo "Align them before preparing another release." >&2
              exit 1
            fi
          else
            current_version=$package_version
          fi

          if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Current version is not valid semver: ${current_version}" >&2
            exit 1
          fi

          IFS=. read -r major minor _ <<< "$current_version"
          case "${{ inputs.version_bump }}" in
            major)
              major=$((major + 1))
              minor=0
              ;;
            minor)
              minor=$((minor + 1))
              ;;
          esac

          version="${major}.${minor}.0"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "Preparing v${version} from ${current_version}"

      - name: Install dependencies
        run: npm ci

      - name: Update npm package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version

          package_version=$(node --print "require('./package.json').version")
          lock_version=$(node --print "require('./package-lock.json').version")
          root_lock_version=$(node --print "require('./package-lock.json').packages[''].version")

          if [[ "$package_version" != "$VERSION" || "$lock_version" != "$VERSION" || "$root_lock_version" != "$VERSION" ]]; then
            echo "npm did not update every package version to ${VERSION}." >&2
            exit 1
          fi

      - name: Check site
        run: npm run check

      - name: Build site
        env:
          PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
        run: |
          if [[ ! "$PUBLIC_GOOGLE_ANALYTICS_ID" =~ ^G-[A-Za-z0-9]+$ ]]; then
            echo 'The GOOGLE_ANALYTICS_ID repository variable must be a valid GA4 measurement ID.' >&2
            exit 1
          fi
          npm run build

      - name: Package site
        id: package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          asset="kurippu-site-${TAG}.tar.gz"
          tar -czf "$asset" -C dist .
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurippu-site-${{ steps.version.outputs.tag }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
          retention-days: 31

      # Firebase setup remains outside this workflow. Add firebase.json with
      # hosting.public set to dist, then configure the variable and secret below.
      - name: Verify Firebase release configuration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ ! -f firebase.json ]]; then
            echo 'firebase.json is required before releases can be deployed.' >&2
            exit 1
          fi
          if [[ -z "$FIREBASE_PROJECT_ID" ]]; then
            echo 'The FIREBASE_PROJECT_ID repository variable is required.' >&2
            exit 1
          fi
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            echo 'The FIREBASE_SERVICE_ACCOUNT_JSON repository secret is required.' >&2
            exit 1
          fi

      # Uses the Firebase CLI directly, authenticated with the service account
      # key. firebase-tools is deliberately unpinned so releases never need a
      # manual bump. This step runs before the tag is pushed, so a bad CLI
      # release fails the run without tagging anything. A plain hosting deploy
      # publishes to the live channel.
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          key_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$key_file"
          chmod 600 "$key_file"
          GOOGLE_APPLICATION_CREDENTIALS="$key_file" \
            npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT_ID"
          rm -f "$key_file"

      # Publish the bump only once the site is deployed, so every tag on the
      # branch corresponds to a release that actually went live.
      - name: Push version bump and tag
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "Aayush Sinha"
          git config user.email "hello@yush.dev"
          git add package.json package-lock.json
          git commit --message "chore: bump version to ${VERSION}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          git tag --annotate "$TAG" --message "Release ${TAG}"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          notes_args=()
          if [[ -n "$PREVIOUS_TAG" ]]; then
            notes_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          gh release create "$TAG" "$ASSET" \
            --title "$TAG" \
            --generate-notes \
            "${notes_args[@]}"
